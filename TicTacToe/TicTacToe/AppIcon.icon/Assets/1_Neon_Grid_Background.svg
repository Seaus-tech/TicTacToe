<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep space dark base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0A0F1E" />
    </linearGradient>
    <!-- Subtle teal ambient bloom at centre -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Corner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>

  <!-- Apple squircle clip -->
  <clipPath id="squircle">
    <rect width="512" height="512" rx="115" ry="115" />
  </clipPath>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bgGrad)" />
    <rect width="512" height="512" fill="url(#bloom)" />
    <rect width="512" height="512" fill="url(#vignette)" />
  </g>
</svg>
