<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sharp overlay shadow to isolate grid intersections -->
    <filter id="gridDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Clean, Balanced 3x3 Grid Structure Core -->
  <g filter="url(#gridDepth)" stroke="#222F43" stroke-width="16" stroke-linecap="round">
    <!-- Vertical Channels -->
    <line x1="200" y1="110" x2="200" y2="402" />
    <line x1="312" y1="110" x2="312" y2="402" />
    
    <!-- Horizontal Channels -->
    <line x1="110" y1="200" x2="402" y2="200" />
    <line x1="110" y1="312" x2="402" y2="312" />
  </g>
</svg>
