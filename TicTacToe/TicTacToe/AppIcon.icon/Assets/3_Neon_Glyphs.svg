<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- X: hot pink → purple gradient -->
    <linearGradient id="gradX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D78" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>

    <!-- O: cyan → sky blue gradient -->
    <linearGradient id="gradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00AAFF" />
    </linearGradient>

    <!-- Soft glow for X -->
    <filter id="glowX" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow for O -->
    <filter id="glowO" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!--
    3×3 grid cell centres (grid lines at 186 and 326):
    Col centres: 141, 256, 371
    Row centres: 141, 256, 371

    Winning diagonal (top-left → bottom-right): cells (0,0) (1,1) (2,2)
    Show X winning, O placed in corners/edges to make it look like a real game.

    Pieces placed:
      X  →  (0,0)=141,141   (1,1)=256,256   (2,2)=371,371   ← winning diagonal
      O  →  (0,2)=371,141   (2,0)=141,371
  -->

  <g clip-path="url(#squircle)">

    <!-- ── X pieces (winning diagonal) ── -->
    <g stroke="url(#gradX)" stroke-width="28" stroke-linecap="round"
       filter="url(#glowX)">
      <!-- X at top-left cell (141,141), arm half-length 34 -->
      <line x1="107" y1="107" x2="175" y2="175" />
      <line x1="175" y1="107" x2="107" y2="175" />
      <!-- X at centre cell (256,256) -->
      <line x1="222" y1="222" x2="290" y2="290" />
      <line x1="290" y1="222" x2="222" y2="290" />
      <!-- X at bottom-right cell (371,371) -->
      <line x1="337" y1="337" x2="405" y2="405" />
      <line x1="405" y1="337" x2="337" y2="405" />
    </g>

    <!-- Diagonal win-line strike-through -->
    <line x1="107" y1="107" x2="405" y2="405"
          stroke="url(#gradX)" stroke-width="8"
          stroke-linecap="round" opacity="0.55"
          filter="url(#glowX)" />

    <!-- ── O pieces ── -->
    <g stroke="url(#gradO)" stroke-width="22" fill="none"
       stroke-linecap="round" filter="url(#glowO)">
      <!-- O at top-right cell (371,141) -->
      <circle cx="371" cy="141" r="34" />
      <!-- O at bottom-left cell (141,371) -->
      <circle cx="141" cy="371" r="34" />
    </g>

  </g>
</svg>
